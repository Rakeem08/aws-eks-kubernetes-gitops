<text x="100" y="848" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">Dotted: configuration, deployment or image flow. Request traffic enters through the public ALB and reaches pods.</text>
<rect x="55" y="945" width="1690" height="175" rx="24" fill="#edf3fa" stroke="#d3dfed"/>
<text x="80" y="983" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#3f5675" font-weight="700">DESIGN &amp; OPERATIONS</text>
<text x="80" y="1023" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#2563eb" font-weight="700">01  TRACEABLE ARTIFACTS</text>
<text x="80" y="1057" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">The image is tagged with the Git commit SHA.</text>
<text x="80" y="1087" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">The workflow commits Helm image values.</text>
<text x="630" y="1023" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#2563eb" font-weight="700">02  DECLARATIVE DELIVERY</text>
<text x="630" y="1057" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">Argo CD reads Git and reconciles EKS.</text>
<text x="630" y="1087" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">prune + selfHeal are enabled in Application.</text>
<text x="1180" y="1023" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#2563eb" font-weight="700">03  ALTERNATIVE PIPELINE</text>
<text x="1180" y="1057" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#52647c" font-weight="400">This flow lives in the gitops branch.</text>
<text x="1180" y="1087" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">Jenkins delivery remains on main.</text>
<text x="65" y="1175" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#52647c" font-weight="400">BUILT WITH   GitHub Actions • Docker • ECR • Helm • Argo CD • EKS • AWS OIDC</text>
