<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc"><title id="title">AWS Kubernetes GitOps Delivery</title><desc id="desc">GitHub Actions in the gitops branch tests a container, pushes commit-SHA-tagged images to ECR and commits updated Helm image values. Argo CD reads the gitops branch and synchronizes the Helm chart to EKS with prune and self-heal enabled.</desc><defs>
