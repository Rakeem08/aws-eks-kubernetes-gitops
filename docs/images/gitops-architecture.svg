<text x="60" y="123" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#12223b" font-weight="700">AWS Kubernetes GitOps Delivery</text>
<text x="60" y="164" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#52647c" font-weight="400">Test and publish images. Commit the desired version. Let Argo CD reconcile EKS.</text>
