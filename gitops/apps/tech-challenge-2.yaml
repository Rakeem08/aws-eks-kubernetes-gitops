apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tech-challenge-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rakeem08/aws-eks-kubernetes-gitops.git
    targetRevision: phase-1-foundations
    path: helm/tech-challenge-2
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tech-challenge-2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true